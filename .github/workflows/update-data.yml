name: 每日自動同步賽事數據並部署看板

on:
  schedule:
    # UTC 01:41 = 台灣時間 (Asia/Taipei, UTC+8) 每日早上 09:41（錯開整點尖峰）
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      refresh_year:
        description: "指定刷新年度（預設 auto 自動推算，填 all 表示全年度）"
        required: false
        type: string
        default: "auto"
      refresh_season:
        description: "指定刷新賽季（預設 auto 自動推算；指定賽季時建議一併填寫年度）"
        required: false
        type: choice
        default: "auto"
        options:
          - "auto"
          - "春季"
          - "秋季"
          - "全部"
      discover:
        description: "是否連線探索全新賽事網址（等同 update_full_discovery）"
        required: false
        type: boolean
        default: false
      force:
        description: "強制重新下載所有歷史與當季快取"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "data-pipeline"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.detect.outputs.data_changed }}
      new_sha: ${{ steps.commit.outputs.new_sha }}
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 設定 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-crawler.txt"

      - name: 安裝爬蟲與管線依賴
        run: pip install -r requirements-crawler.txt

      - name: 還原並保存 HTML 本地快取
        uses: actions/cache@v6
        with:
          path: data/raw_html
          key: raw-html-v1-${{ hashFiles('data/海盜隊網頁標題.csv') }}-${{ github.run_id }}
          restore-keys: |
            raw-html-v1-${{ hashFiles('data/海盜隊網頁標題.csv') }}-
            raw-html-v1-

      - name: 執行數據同步與驗證管線
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REFRESH_YEAR: ${{ inputs.refresh_year }}
          INPUT_REFRESH_SEASON: ${{ inputs.refresh_season }}
          INPUT_DISCOVER: ${{ inputs.discover }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=("--auto-current")
          else
            if [ "$INPUT_DISCOVER" = "true" ]; then
              args+=("--discover")
            fi
            if [ "$INPUT_FORCE" = "true" ]; then
              args+=("--force")
            fi
            if [ "$INPUT_REFRESH_YEAR" = "auto" ] && [ "$INPUT_REFRESH_SEASON" = "auto" ] && [ "$INPUT_FORCE" != "true" ]; then
              args+=("--auto-current")
            else
              if [ -n "$INPUT_REFRESH_YEAR" ] && [ "$INPUT_REFRESH_YEAR" != "all" ] && [ "$INPUT_REFRESH_YEAR" != "auto" ]; then
                args+=("--refresh-year" "$INPUT_REFRESH_YEAR")
              fi
              if [ -n "$INPUT_REFRESH_SEASON" ] && [ "$INPUT_REFRESH_SEASON" != "全部" ] && [ "$INPUT_REFRESH_SEASON" != "auto" ]; then
                args+=("--refresh-season" "$INPUT_REFRESH_SEASON")
              fi
            fi
          fi
          echo "執行參數: ${args[*]}"
          python -u run_pipeline.py "${args[@]}"

      - name: 檢查核心賽事數據是否有實質異動
        id: detect
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          from pathlib import Path

          def write_output(name: str, value: str) -> None:
              out_path = os.environ["GITHUB_OUTPUT"]
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          # 1. 檢查種子 CSV 是否有變更
          csv_diff = subprocess.run(
              ["git", "status", "--porcelain", "--", "data/海盜隊網頁標題.csv"],
              capture_output=True,
              text=True,
              check=True,
          )
          csv_changed = bool(csv_diff.stdout.strip())

          # 2. 比對新舊 pirates.json（排除每次執行皆會變動的 meta.generated_at）
          json_changed = False
          new_json_path = Path("web/public/data/pirates.json")
          new_data = json.loads(new_json_path.read_text(encoding="utf-8"))
          if isinstance(new_data.get("meta"), dict):
              new_data["meta"].pop("generated_at", None)

          old_res = subprocess.run(
              ["git", "show", "HEAD:web/public/data/pirates.json"],
              capture_output=True,
              text=True,
          )
          if old_res.returncode != 0:
              json_changed = True
          else:
              old_data = json.loads(old_res.stdout)
              if isinstance(old_data.get("meta"), dict):
                  old_data["meta"].pop("generated_at", None)
              json_changed = (old_data != new_data)

          if csv_changed or json_changed:
              print(f"偵測到實質數據變動 (csv_changed={csv_changed}, json_changed={json_changed})")
              write_output("data_changed", "true")
          else:
              print("今日無新賽事或數據變動，略過提交與重部署。")
              subprocess.run(
                  [
                      "git",
                      "checkout",
                      "--",
                      "data/pirates.db",
                      "web/public/data/pirates.json",
                      "data/youtube_videos.json",
                      "data/youtube_match_mapping_report.csv",
                  ],
                  check=False,
              )
              write_output("data_changed", "false")
          EOF

      - name: 提交並推送最新數據至 main
        id: commit
        if: steps.detect.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "data/pirates.db" "data/海盜隊網頁標題.csv" "web/public/data/pirates.json" "data/youtube_videos.json" "data/youtube_match_mapping_report.csv"
          if [ -f "data/youtube_manual_overrides.csv" ]; then
            git add -- "data/youtube_manual_overrides.csv"
          fi
          git commit -m "chore(data): 自動同步最新賽事數據 [skip ci]"
          git pull --rebase origin main
          git push origin main
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: update-data
    if: needs.update-data.outputs.data_changed == 'true'
    uses: ./.github/workflows/deploy-web.yml
    with:
      ref: ${{ needs.update-data.outputs.new_sha }}
    secrets: inherit
